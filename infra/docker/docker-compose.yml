version: "3.9"
name: second-memory

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: second-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: second_memory
      POSTGRES_PASSWORD: second_memory_dev
      POSTGRES_DB: second_memory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:8
    container_name: second-memory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

volumes:
  postgres_data:
  redis_data:
