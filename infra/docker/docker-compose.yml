version: '3.9'
name: second-memory

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: second-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: second_memory
      POSTGRES_PASSWORD: second_memory_dev
      POSTGRES_DB: second_memory
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:8
    container_name: second-memory-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']

  worker-embeddings:
    image: python:3.12-slim
    container_name: second-memory-worker-embeddings
    restart: unless-stopped
    working_dir: /app/services/worker-embeddings
    volumes:
      - ../..:/app
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://second_memory:second_memory_dev@postgres:5432/second_memory
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      WORKER_CONCURRENCY: 5
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "pip install uv &&
      uv sync &&
      uv run python -m worker_embeddings.main"

volumes:
  postgres_data:
  redis_data:
